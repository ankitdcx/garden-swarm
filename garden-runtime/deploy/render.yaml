# Prepared deployment option only. Render workspace confirmation is required.
# Root repo path garden-runtime; do not confuse this with the deployed Worker subset.
services:
  - type: web
    name: garden-native-demo
    runtime: docker
    plan: free
    region: singapore
    rootDir: garden-runtime
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # Use the CI-tested image ENTRYPOINT. A Docker Command would replace CMD
    # and could append a second Python command to the existing ENTRYPOINT.
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
