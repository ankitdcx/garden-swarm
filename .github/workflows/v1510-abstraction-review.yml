name: Temporary v15.10 abstraction OpenRouter board
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'review-inputs/v1510/**'
      - '.github/workflows/v1510-abstraction-review.yml'

permissions:
  contents: read

concurrency:
  group: v1510-abstraction-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.repository == 'ankitdcx/garden-swarm' && startsWith(github.head_ref, 'chatgpt/v1510-abstraction-review-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated reviewer board
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error, pathlib, hashlib
          packet = pathlib.Path('review-inputs/v1510/ABSTRACTION_CANDIDATE_R0.txt').read_text()
          models = [
            ('deepseek','deepseek/deepseek-v4.1-flash'),
            ('qwen','qwen/qwen3.8-flash'),
            ('glm','z-ai/glm-5.3-flash'),
            ('xiaomi','xiaomi/mimo-v2.5'),
            ('gemini','google/gemini-3.8-flash'),
          ]
          system = '''You are an independent architecture reviewer. Review only the supplied candidate. Be skeptical, precise, and concrete. Do not assume other reviewers agree. Preserve semantic distinctions and explicitly identify any abstraction that could hide authority, applicability, evidence, failure, uncertainty, or owner differences. Output plain text with a verdict and numbered findings.'''
          results=[]
          for family, model in models:
              body={
                'model':model,
                'messages':[{'role':'system','content':system},{'role':'user','content':packet}],
                'temperature':0.15,
                'max_tokens':9000
              }
              req=urllib.request.Request(
                'https://openrouter.ai/api/v1/chat/completions',
                data=json.dumps(body).encode(),
                headers={
                  'Authorization':'Bearer '+os.environ['OPENROUTER_API_KEY'],
                  'Content-Type':'application/json',
                  'HTTP-Referer':'https://github.com/ankitdcx/garden-swarm',
                  'X-Title':'Garden v15.10 temporary abstraction review'
                })
              rec={'family':family,'requested_model':model,'packet_sha256':hashlib.sha256(packet.encode()).hexdigest()}
              try:
                  with urllib.request.urlopen(req, timeout=420) as r:
                      raw=json.loads(r.read())
                  rec['status']='OK'
                  rec['actual_model']=raw.get('model')
                  rec['response_id']=raw.get('id')
                  rec['usage']=raw.get('usage')
                  rec['text']=raw['choices'][0]['message'].get('content','')
              except Exception as e:
                  rec['status']='ERROR'
                  rec['error_type']=type(e).__name__
                  if isinstance(e, urllib.error.HTTPError):
                      rec['http_status']=e.code
              results.append(rec)
              time.sleep(2)
          pathlib.Path('review-results/v1510').mkdir(parents=True,exist_ok=True)
          pathlib.Path('review-results/v1510/board.json').write_text(json.dumps({
            'schema':'GardenV1510TemporaryIndependentReviewBoard/v1',
            'semantic_delta_admitted':False,
            'canonical_promotion':False,
            'packet_sha256':hashlib.sha256(packet.encode()).hexdigest(),
            'results':results
          },indent=2))
          ok=sum(r['status']=='OK' for r in results)
          print(f'completed {ok}/{len(results)} independent reviews')
          if ok < 3:
              raise SystemExit('insufficient independent review completion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1510-abstraction-board-${{ github.run_id }}
          path: review-results/v1510/board.json
          if-no-files-found: error
          retention-days: 7
