name: Garden free ZDR probe

on:
  push:
    branches: [garden-swarm-orchestrator]
    paths:
      - 'swarm/roles-free-zdr.json'
      - '.github/workflows/swarm-free-zdr-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-zdr-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run one zero-dollar free-model probe with ZDR enforced
        run: |
          python swarm/orchestrator.py \
            --roles swarm/roles-free-zdr.json \
            --role-tier all \
            --live \
            --max-calls 1 \
            --max-concurrency 1 \
            --max-chars 12000 \
            --max-tokens 5000 \
            --output swarm/runs/free-zdr-probe.json

      - name: Show probe status without exposing prompt content
        run: |
          python - <<'PY'
          import json
          p = json.load(open('swarm/runs/free-zdr-probe.json', encoding='utf-8'))
          for r in p.get('results', []):
              print('status=', r.get('status'))
              print('requested_model=', r.get('requested_model'))
              print('returned_model=', r.get('returned_model'))
              print('usage=', r.get('usage'))
              print('output_present=', bool(r.get('output')))
              print('output_chars=', len(r.get('output') or ''))
              if r.get('error'):
                  print('error=', r.get('error')[:500])
          PY

      - name: Upload probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-free-zdr-probe
          path: swarm/runs/free-zdr-probe.json
          if-no-files-found: warn
