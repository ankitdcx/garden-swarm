name: Garden v15.9 wave 022-026 review

on:
  push:
    branches:
      - 'chatgpt/v159-wave3-022-026-20260917'
    paths:
      - 'review-inputs/v159-wave3/trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'ankitdcx/garden-swarm'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: P022_KNOWLEDGE_CURATION_GSL_KR_WORLD_EVIDENCE
            file: P022_KNOWLEDGE_CURATION_GSL_KR_WORLD_EVIDENCE.txt
          - id: P023_GSL_PHYSICS_DIGITAL_TWIN_CRITICAL_CONTINUITY
            file: P023_GSL_PHYSICS_DIGITAL_TWIN_CRITICAL_CONTINUITY.txt
          - id: P024_CAUSAL_SAFETY_UBC_CLIC_GCL
            file: P024_CAUSAL_SAFETY_UBC_CLIC_GCL.txt
          - id: P025_TSI_TIA_ART_IIC_PIR
            file: P025_TSI_TIA_ART_IIC_PIR.txt
          - id: P026_CSI_SMCD_CAD_OAC_CTSN_PAI
            file: P026_CSI_SMCD_CAD_OAC_CTSN_PAI.txt
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Four-family blind review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/v159_wave_board.py "review-inputs/v159-wave3/${{ matrix.file }}"
      - name: Upload packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-wave3-${{ matrix.id }}-${{ github.run_id }}
          path: review-results/v159-wave1/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
