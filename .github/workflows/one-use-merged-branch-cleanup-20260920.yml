name: One-use reviewer-routing branch cleanup 2026-09-20

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event.before == '2a14cf22e481d09b732d68b24cc30d5701d51e11' &&
      startsWith(github.event.head_commit.message, 'Retire merged reviewer-routing branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete exact reviewed branches only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ["GITHUB_TOKEN"]; repo=os.environ["GITHUB_REPOSITORY"]; owner=os.environ["GITHUB_REPOSITORY_OWNER"]
          api="https://api.github.com/repos/"+repo
          def req(url, method="GET"):
              q=urllib.request.Request(url,method=method,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"garden-one-use-reviewer-routing-cleanup"})
              with urllib.request.urlopen(q,timeout=30) as r:
                  raw=r.read(); return json.loads(raw.decode()) if raw else None
          deleted=[]; skipped=[]
          target="chatgpt/reviewer-routing-availability-20260920"; expected="4e8200121ddafc699fd4a3e6914504cf99823fec"
          pr=req(api+"/pulls/278")
          if pr.get("merged_at") is None or ((pr.get("head") or {}).get("ref")) != target or ((pr.get("head") or {}).get("sha")) != expected:
              raise SystemExit("PR 278 merge binding mismatch")
          ref="heads/"+urllib.parse.quote(target,safe="/")
          live=req(api+"/git/ref/"+ref)
          if ((live or {}).get("object") or {}).get("sha") != expected:
              skipped.append([target,"sha_changed"])
          else:
              q=urllib.parse.urlencode({"state":"open","head":owner+":"+target,"per_page":100})
              if req(api+"/pulls?"+q): skipped.append([target,"open_pr_now_exists"])
              else:
                  req(api+"/git/refs/"+ref,method="DELETE"); deleted.append(target)
          cleanup="chatgpt/retire-reviewer-routing-branch-20260920"
          p=req(api+"/pulls/279"); csha=((p.get("head") or {}).get("sha"))
          if p.get("merged_at") and csha:
              q=urllib.parse.urlencode({"state":"open","head":owner+":"+cleanup,"per_page":100})
              if not req(api+"/pulls?"+q):
                  cref="heads/"+urllib.parse.quote(cleanup,safe="/")
                  try: live=req(api+"/git/ref/"+cref)
                  except urllib.error.HTTPError as e:
                      live=None if e.code==404 else (_ for _ in ()).throw(e)
                  if live and ((live.get("object") or {}).get("sha"))==csha:
                      req(api+"/git/refs/"+cref,method="DELETE"); deleted.append(cleanup)
          print("DELETED="+json.dumps(deleted,sort_keys=True))
          print("SKIPPED="+json.dumps(skipped,sort_keys=True))
