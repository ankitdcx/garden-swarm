name: One-use merged branch cleanup 2026-09-20

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event.before == '791e97b90c4ea628642a92f11d411c3eb94aea7c' &&
      startsWith(github.event.head_commit.message, 'One-use merged branch cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify branch lifecycle scanner
        run: python -m unittest tests.test_branch_lifecycle -v
      - name: Build exact live lifecycle receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python tools/check_branch_lifecycle.py \
            --repo "${{ github.repository }}" \
            --observed-at "${{ github.run_started_at }}" \
            --output branch-lifecycle-receipt.json
          rc=$?
          echo "scanner_rc=$rc"
          cat branch-lifecycle-receipt.json
          exit 0
      - name: Delete only exact merged-delete-eligible branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          api = "https://api.github.com/repos/" + repository
          receipt = json.load(open("branch-lifecycle-receipt.json", encoding="utf-8"))
          protected = {"main", "garden-review-state"}

          def request(url, *, method="GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "garden-one-use-merged-branch-cleanup",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")) if raw else None

          deleted = []
          skipped = []
          for row in receipt.get("dispositions", []):
              branch = row.get("branch")
              expected_sha = row.get("sha")
              if row.get("disposition") != "MERGED_DELETE_ELIGIBLE":
                  continue
              if row.get("destructive_action_authorized") is not True:
                  raise SystemExit("receipt inconsistency: destructive authorization missing")
              if not branch or branch in protected:
                  skipped.append([branch, "protected"])
                  continue

              ref_path = "heads/" + urllib.parse.quote(branch, safe="/")
              try:
                  live = request(api + "/git/ref/" + ref_path)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      skipped.append([branch, "already_absent"])
                      continue
                  raise
              live_sha = ((live or {}).get("object") or {}).get("sha")
              if live_sha != expected_sha:
                  skipped.append([branch, "sha_changed"])
                  continue

              q = urllib.parse.urlencode({
                  "state": "open",
                  "head": owner + ":" + branch,
                  "per_page": 100,
              })
              open_prs = request(api + "/pulls?" + q)
              if open_prs:
                  skipped.append([branch, "open_pr_now_exists"])
                  continue

              request(api + "/git/refs/" + ref_path, method="DELETE")
              deleted.append(branch)

          print("DELETED_BRANCHES=" + json.dumps(deleted, sort_keys=True))
          print("SKIPPED_BRANCHES=" + json.dumps(skipped, sort_keys=True))
