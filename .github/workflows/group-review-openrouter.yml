name: Garden GROUP_REVIEW OpenRouter

on:
  workflow_dispatch:
    inputs:
      trigger_issue_number:
        description: Existing GROUP_REVIEW run issue number
        required: true
        type: string

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'ankitdcx/garden-swarm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify GROUP_REVIEW bus offline
        run: |
          python -m unittest tests.test_group_review_bus tests.test_group_review_openrouter_worker -v
      - name: Admit only an owner-authored public GROUP_REVIEW packet
        env:
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.check_dispatch_admission --group-review
      - name: Execute at most one isolated OpenRouter GROUP_REVIEW call
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.group_review_openrouter_worker run
