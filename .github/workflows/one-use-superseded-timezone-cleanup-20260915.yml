name: One-use superseded timezone branch cleanup 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-superseded-timezone-cleanup-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete exact superseded timezone branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['REPO']; owner=os.environ['OWNER']; token=os.environ['GH_TOKEN']; self_branch=os.environ['SELF_BRANCH']
          api=f'https://api.github.com/repos/{repo}'
          target='fix/hourly-ist-sequence-20260915'; expected='5f08301e88d75dd8acf0c207a847fe86be33d2d2'; pr_no=129
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
          def delete(branch):
              ref=urllib.parse.quote(f'heads/{branch}',safe='')
              req=urllib.request.Request(f'{api}/git/refs/{ref}',method='DELETE',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: return r.status
          b=get(f"{api}/branches/{urllib.parse.quote(target,safe='')}"); actual=b['commit']['sha']
          q=urllib.parse.urlencode({'state':'open','head':f'{owner}:{target}','per_page':100}); opens=get(f'{api}/pulls?{q}')
          pr=get(f'{api}/pulls/{pr_no}'); text=((pr.get('title') or '')+'\n'+(pr.get('body') or '')).upper()
          valid=(actual==expected and not opens and pr.get('state')=='closed' and not pr.get('merged_at') and (pr.get('head') or {}).get('sha')==actual and 'SUPERSEDED' in text and '#130' in text)
          receipt={'schema':'GardenOneUseBranchCleanupReceipt/v1','repository':repo,'target':target,'expected_sha':expected,'actual_sha':actual,'open_pr_count':len(opens),'pr':pr_no,'valid':valid,'deleted':False}
          if valid:
              delete(target); receipt['deleted']=True; receipt['reason']='EXACT_HEAD_SUPERSEDED_BY_MERGED_REPLACEMENT_130'
          else: receipt['reason']='EVIDENCE_MISMATCH_FAIL_CLOSED'
          with open('timezone-branch-cleanup-receipt.json','w') as f: json.dump(receipt,f,indent=2,sort_keys=True)
          print(json.dumps(receipt,indent=2))
          if self_branch.startswith('maintenance/one-use-superseded-timezone-cleanup-'):
              try: delete(self_branch)
              except Exception as exc: print('self-delete warning',repr(exc))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timezone-branch-cleanup-receipt-${{ github.run_id }}
          path: timezone-branch-cleanup-receipt.json
          if-no-files-found: error
          retention-days: 30
