name: One-use public IP provenance DeepSeek review

on:
  workflow_dispatch:
  # Provider work is dispatched only by the paused single Coordinator.

permissions:
  contents: read

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  deepseek-public-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce paused and single-dispatch boundary
        run: python -m tools.check_dispatch_admission

      - name: Compile one-use reviewer
        run: python -m py_compile tools/run_one_use_ip_provenance_deepseek_review.py

      - name: Generate approved paid reviewer selection
        run: python -m tools.select_paid_matrix_reviewers

      - name: Run bounded public-only DeepSeek review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.run_one_use_ip_provenance_deepseek_review

      - name: Upload DeepSeek review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ip-provenance-deepseek-${{ github.run_id }}
          path: ip-provenance-deepseek-review.json
          if-no-files-found: error
          retention-days: 30
