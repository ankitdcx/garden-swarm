name: One-use public IP provenance DeepSeek review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'PATENT_AND_USE_NOTICE.md'

permissions:
  contents: read

jobs:
  deepseek-public-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile one-use reviewer
        run: python -m py_compile tools/run_one_use_ip_provenance_deepseek_review.py

      - name: Generate approved paid reviewer selection
        run: python -m tools.select_paid_matrix_reviewers

      - name: Run bounded public-only DeepSeek review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.run_one_use_ip_provenance_deepseek_review

      - name: Upload DeepSeek review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ip-provenance-deepseek-${{ github.run_id }}
          path: ip-provenance-deepseek-review.json
          if-no-files-found: warn
          retention-days: 30
