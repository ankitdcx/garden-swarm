name: Garden IP origin multi-agent review

on:
  workflow_dispatch:
  # Provider work is dispatched only by the paused single Coordinator.

permissions:
  contents: read

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  openrouter-ip-origin-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce paused and single-dispatch boundary
        run: python -m tools.check_dispatch_admission

      - name: Compile and verify bounded review topology
        run: |
          python -m py_compile tools/run_ip_origin_multi_agent_review.py
          python -m py_compile tools/select_ip_origin_reviewers.py
          python -m unittest tests.test_ip_origin_review_selection -v
          python -m unittest tests.test_ip_origin_review_budget -v

      - name: Generate approved multi-family IP-origin selection
        run: python -m tools.select_ip_origin_reviewers

      - name: Run budget-correct specialist reviews and all-family cross-exams
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.run_ip_origin_multi_agent_review

      - name: Upload immutable multi-agent review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-ip-origin-review-${{ github.run_id }}
          path: ip-origin-multi-agent-review.json
          if-no-files-found: error
          retention-days: 90
