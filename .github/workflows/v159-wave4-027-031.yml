name: Garden v15.9 wave 027-031 review

on:
  push:
    branches:
      - 'chatgpt/v159-wave4-027-031-20260917'
    paths:
      - 'review-inputs/v159-wave4/trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'ankitdcx/garden-swarm'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: P027_SCT_STRUCTURAL_COHERENCE
            file: P027_SCT_STRUCTURAL_COHERENCE.txt
          - id: P028_TRAIN_GAIA_DOMAIN_PROFILES
            file: P028_TRAIN_GAIA_DOMAIN_PROFILES.txt
          - id: P029_VSM_RPM_PPM_TFT_FET_COMPOSITION
            file: P029_VSM_RPM_PPM_TFT_FET_COMPOSITION.txt
          - id: P030_RESEARCH_LEARNING_DEFERRED_COMPARATIVE
            file: P030_RESEARCH_LEARNING_DEFERRED_COMPARATIVE.txt
          - id: P031_RELIABILITY_GSL_ARCHITECTURES
            file: P031_RELIABILITY_GSL_ARCHITECTURES.txt
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Four-family blind review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/v159_wave_board.py "review-inputs/v159-wave4/${{ matrix.file }}"
      - name: Upload packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-wave4-${{ matrix.id }}-${{ github.run_id }}
          path: review-results/v159-wave1/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
