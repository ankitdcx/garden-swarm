name: Garden public-release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public release
        run: python scripts/verify_public_release.py
      - name: Audit whole repository into Garden/GSL profile
        run: python scripts/audit_repo_gsl.py --strict-frontier --output /tmp/garden-repo-gsl-audit.json
      - name: Run Garden/GSL application conformance pipeline
        run: python scripts/verify_gsl_application.py --output /tmp/garden-gsl-conformance-receipt.json
      - name: Build repository reference-closure receipt
        run: |
          set +e
          python scripts/build_reference_closure.py --output /tmp/reference-closure-receipt.json
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/reference-closure-receipt.json
          fi
          exit "$status"
      - name: Build durable self-excluding receipt snapshots
        run: python scripts/build_durable_gsl_receipts.py
      - name: Gate pull-request diff as a Garden/GSL transition
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python scripts/gate_repo_change.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --output /tmp/repo-change-gate-receipt.json
          status=$?
          cat /tmp/repo-change-gate-receipt.json
          exit "$status"
      - name: Upload immutable conformance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-public-gsl-conformance-${{ github.run_id }}
          path: |
            /tmp/garden-repo-gsl-audit.json
            /tmp/garden-gsl-conformance-receipt.json
            /tmp/reference-closure-receipt.json
            /tmp/repo-change-gate-receipt.json
            gsl/receipts/CONFORMANCE_RECEIPT.json
            gsl/receipts/REFERENCE_CLOSURE_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
