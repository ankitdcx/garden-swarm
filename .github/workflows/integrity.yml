name: Garden public-release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public release
        run: python scripts/verify_public_release.py
      - name: Verify free-review and Design Review Matrix boundaries offline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit whole repository into Garden/GSL profile
        run: python scripts/audit_repo_gsl.py --strict-frontier --output /tmp/garden-repo-gsl-audit.json
      - name: Run Garden/GSL application conformance pipeline
        run: python scripts/verify_gsl_application.py --output /tmp/garden-gsl-conformance-receipt.json
      - name: Build repository reference-closure receipt
        run: |
          set +e
          python scripts/build_reference_closure.py --output /tmp/reference-closure-receipt.json
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/reference-closure-receipt.json
          fi
          exit "$status"
      - name: Upload immutable conformance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-public-gsl-conformance-${{ github.run_id }}
          path: |
            /tmp/garden-repo-gsl-audit.json
            /tmp/garden-gsl-conformance-receipt.json
            /tmp/reference-closure-receipt.json
          if-no-files-found: warn
          retention-days: 30
