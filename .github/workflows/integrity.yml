name: Garden public-release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install governed repository packages and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r prototype/requirements.txt -r server/requirements.txt pytest
      - name: Verify free-review module entrypoints offline
        run: python -m unittest discover -s tests -p 'test_free_review_entrypoints.py' -v
      - name: Run authoritative Garden/GSL aggregate pipeline
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          set +e
          python scripts/run_gsl_ci_pipeline.py --output /tmp/ci-conformance-pipeline-receipt.json
          status=$?
          cat /tmp/ci-conformance-pipeline-receipt.json
          exit "$status"
      - name: Upload immutable conformance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-public-gsl-conformance-${{ github.run_id }}
          path: |
            /tmp/ci-conformance-pipeline-receipt.json
            /tmp/garden-repo-gsl-audit.json
            /tmp/garden-gsl-application-receipt.json
            /tmp/reference-closure-receipt.json
            /tmp/gsl-namespace-receipt.json
            /tmp/version-epoch-receipt.json
            /tmp/test-matrix-receipt.json
            /tmp/repo-change-gate-receipt.json
            gsl/receipts/CONFORMANCE_RECEIPT.json
            gsl/receipts/REFERENCE_CLOSURE_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
