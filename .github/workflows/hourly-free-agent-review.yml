name: Garden hourly free multi-model review

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-hourly-free-agent-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deterministic target rotation offline
        run: python -m unittest tests.test_design_target_rotation -v

      - name: Rotate to one bounded Design Review Matrix target this hour
        run: python -m tools.rotate_design_review_target

      - name: Prefer four independent free reviewer families
        run: python -m tools.select_matrix_reviewers --count 4

      - name: Review exactly one rotated Design Review Matrix target
        run: python -m tools.matrix_design_review

      # Gemini is a separate provider-family input and remains proposal-only.
      - name: Run independent Gemini free-tier reviewer when quota-preservation schedule allows
        run: python tools/run_gemini_free_review.py

      - name: Enforce target binding, independent-review, zero-cost, and no-auto-admission boundaries
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('agents/design-review-matrix.json', encoding='utf-8'))
          target_selection = json.load(open('agents/runtime/design-target-selection.json', encoding='utf-8'))
          selection = json.load(open('agents/runtime/free-selection.json', encoding='utf-8'))
          bundle = json.load(open('agents/outbox/hourly/design-review-bundle.json', encoding='utf-8'))

          selected = selection['selected']
          minimum = int(matrix['minimum_independent_reviewer_families'])
          preferred = int(matrix['preferred_independent_reviewer_families'])
          assert minimum >= 3
          assert preferred >= minimum
          assert len(selected) >= minimum
          assert len({row['family'] for row in selected}) == len(selected)
          assert all(str(row['model']).endswith(':free') for row in selected)

          assert target_selection['schema'] == 'GardenDesignTargetSelectionReceipt/v1'
          assert target_selection['selection_mode'] == 'DETERMINISTIC_HOURLY_ROUND_ROBIN'
          assert target_selection['target_id'] == matrix['active_target_id']
          assert target_selection['target_count'] == len(matrix['targets'])
          assert target_selection['target_index'] == target_selection['hour_slot'] % target_selection['target_count']
          assert target_selection['design_epoch'] == matrix['design_epoch']
          assert target_selection['canonical_source_root_sha256'] == matrix['canonical_source_root_sha256']
          assert target_selection['semantic_delta_admitted'] is False

          assert bundle['schema'] == 'GardenDesignReviewBundle/v1'
          assert bundle['target']['target_id'] == target_selection['target_id']
          assert bundle['semantic_delta_admitted'] is False
          assert bundle['design_epoch'] == matrix['design_epoch']
          assert bundle['canonical_source_root_sha256'] == matrix['canonical_source_root_sha256']
          assert bundle['status'] in {
              'INSUFFICIENT_INDEPENDENT_REVIEW',
              'INSUFFICIENT_PEER_CROSS_EXAMINATION',
              'COST_VERIFICATION_FAILED',
              'REVIEW_COMPLETE_NEEDS_GSL_INTEGRATOR',
          }

          called = [row for row in bundle['provider_attempts'] if row.get('status') == 'CALLED']
          explicit_zero = bool(called) and all((row.get('usage') or {}).get('cost') in (0, 0.0) for row in called)
          if not explicit_zero:
              assert bundle['status'] != 'REVIEW_COMPLETE_NEEDS_GSL_INTEGRATOR'
          if bundle['status'] == 'REVIEW_COMPLETE_NEEDS_GSL_INTEGRATOR':
              assert bundle['independent_reviewer_family_count'] >= minimum
              assert bundle['final_disposition_family_count'] >= minimum
              assert bundle['zero_cost_verified'] is True
              assert explicit_zero

          print(json.dumps({
              'target_id': bundle['target']['target_id'],
              'hour_slot': target_selection['hour_slot'],
              'target_index': target_selection['target_index'],
              'target_count': target_selection['target_count'],
              'status': bundle['status'],
              'selected_families': len(selected),
              'preferred_families': preferred,
              'independent_families': bundle['independent_reviewer_family_count'],
              'final_families': bundle['final_disposition_family_count'],
              'explicit_zero_cost': explicit_zero,
              'semantic_delta_admitted': False,
          }, sort_keys=True))
          PY

      - name: Build immutable hourly matrix-review receipt
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          bundle = json.load(open('agents/outbox/hourly/design-review-bundle.json', encoding='utf-8'))
          target_selection = json.load(open('agents/runtime/design-target-selection.json', encoding='utf-8'))
          gemini_path = Path('agents/outbox/hourly/gemini-review.json')
          gemini = json.load(open(gemini_path, encoding='utf-8')) if gemini_path.exists() else None
          receipt = {
              'schema': 'GardenHourlyDesignReviewReceipt/v1',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit': os.environ.get('GITHUB_SHA'),
              'hour_slot': target_selection['hour_slot'],
              'target_id': bundle['target']['target_id'],
              'target_index': target_selection['target_index'],
              'target_count': target_selection['target_count'],
              'selection_receipt': 'agents/runtime/design-target-selection.json',
              'bundle_sha256': bundle['bundle_sha256'],
              'review_status': bundle['status'],
              'gemini_review': gemini,
              'semantic_delta_admitted': False,
              'admission_status': 'PROPOSALS_ONLY_NEEDS_GSL_INTEGRATOR_AND_WHOLE_SOURCE_CROSS_REFERENCE',
          }
          with open('agents/outbox/hourly/combined-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Upload immutable review receipts
        uses: actions/upload-artifact@v4
        with:
          name: garden-hourly-design-review-${{ github.run_id }}
          path: |
            agents/design-review-matrix.json
            agents/runtime/design-target-selection.json
            agents/runtime/free-selection.json
            agents/outbox/hourly/design-review-bundle.json
            agents/outbox/hourly/combined-receipt.json
            agents/outbox/hourly/gemini-review.json
            agents/outbox/hourly/matrix-review/*.json
          if-no-files-found: error
          retention-days: 30
