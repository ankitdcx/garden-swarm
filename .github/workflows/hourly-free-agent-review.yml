name: Garden event-dispatched multi-model review (legacy hourly filename)

on:
  # Scheduled work is owned by the single Garden Coordinator.
  # Legacy filename retained; this worker has no clock trigger.
  workflow_dispatch:
    inputs:
      event_key:
        description: Durable event/material-work key; defaults to dispatched commit SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GARDEN_EVENT_KEY: ${{ inputs.event_key || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce paused and single-dispatch boundary
        run: python -m tools.check_dispatch_admission

      - name: Verify event-driven target rotation and OpenRouter routing offline
        run: |
          python -m unittest tests.test_design_target_rotation -v
          python -m unittest tests.test_free_review_entrypoints -v
          python -m unittest tests.test_paid_review_routing -v
          python -m unittest tests.test_event_driven_context_routing -v

      - name: Select one bounded Design Review Matrix target for this event
        run: python -m tools.rotate_design_review_target --event-key "$GARDEN_EVENT_KEY"

      - name: Select broad free OpenRouter reviewer swarm for this event
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          COUNT=$(python - <<'PY'
          import json
          p = json.load(open('agents/openrouter-paid-review-policy.json', encoding='utf-8'))
          print(int(p['free_swarm']['distinct_families_per_hour']))
          PY
          )
          python -m tools.select_matrix_reviewers --event-key "$GARDEN_EVENT_KEY" --count "$COUNT"

      - name: Run blind free OpenRouter reviews and peer cross-examination
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.matrix_design_review

      - name: Select bounded paid multi-family OpenRouter reviewers
        run: python -m tools.select_paid_matrix_reviewers

      - name: Run blind paid OpenRouter reviews under per-dispatch and daily budget controls
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.run_paid_matrix_review

      - name: Run target-matched Gemini independent reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        run: python -m tools.run_gemini_free_review

      - name: Enforce registered review boundaries
        run: python -m tools.verify_review_boundaries

      - name: Build immutable event-driven multi-provider receipt
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          free_bundle = json.load(open('agents/outbox/hourly/design-review-bundle.json', encoding='utf-8'))
          bundle = json.load(open('agents/outbox/hourly/paid-review-bundle.json', encoding='utf-8'))
          target_selection = json.load(open('agents/runtime/design-target-selection.json', encoding='utf-8'))
          gemini = json.load(open('agents/outbox/hourly/gemini-review.json', encoding='utf-8'))
          receipt = {
              'schema': 'GardenEventDrivenDesignReviewReceipt/v1',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit': os.environ.get('GITHUB_SHA'),
              'event_key_sha256': target_selection.get('event_key_sha256'),
              'event_slot': target_selection['event_slot'],
              'target_id': target_selection['target_id'],
              'target_index': target_selection['target_index'],
              'target_count': target_selection['target_count'],
              'selection_receipt': 'agents/runtime/design-target-selection.json',
              'free_selection_receipt': 'agents/runtime/free-selection.json',
              'free_openrouter_review': free_bundle,
              'paid_selection_receipt': 'agents/runtime/paid-selection.json',
              'openrouter_paid_review': bundle,
              'openrouter_actual_cost_usd': bundle['actual_cost_usd'],
              'openrouter_daily_cost_ceiling_usd': bundle['daily_openrouter_cost_ceiling_usd'],
              'gemini_review': gemini,
              'external_chatgpt_frontier_review_expected_only_if_material': True,
              'chatgpt_frontier_request_builder': 'tools/run_frontier_council.py',
              'cross_examination_expected_as_required_by_route': True,
              'semantic_delta_admitted': False,
              'admission_status': 'PROPOSALS_ONLY_NEEDS_GOVERNED_CHATGPT_GSL_AND_CHALLENGER_WHERE_REQUIRED',
          }
          with open('agents/outbox/hourly/combined-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Upload immutable review receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-event-design-review-${{ github.run_id }}
          path: |
            agents/design-review-matrix.json
            agents/openrouter-paid-review-policy.json
            agents/event-driven-context-policy.json
            agents/runtime/design-target-selection.json
            agents/runtime/free-selection.json
            agents/runtime/paid-selection.json
            agents/outbox/hourly/design-review-bundle.json
            agents/outbox/hourly/matrix-review/*.json
            agents/outbox/hourly/paid-review-bundle.json
            agents/outbox/hourly/boundary-receipt.json
            agents/outbox/hourly/combined-receipt.json
            agents/outbox/hourly/gemini-review.json
            agents/outbox/hourly/paid-review/*.json
          if-no-files-found: error
          retention-days: 30
