name: Build Android AI Council
on:
 workflow_dispatch:
 issues:
  types: [opened]
permissions:
 contents: read
jobs:
 build:
  if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BUILD_AI_COUNCIL]')
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v7
   - uses: actions/setup-java@v6
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v6
     with: {gradle-version: '8.9'}
   - run: cd android-ai-council && gradle :app:assembleDebug
   - uses: actions/upload-artifact@v6
     with:
      name: ai-council-debug-apk
      path: android-ai-council/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 30
