name: Extract Cognitive Arena results
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: read
jobs:
  extract:
    if: startsWith(github.event.issue.title, '[ARENA_EXTRACT]')
    runs-on: ubuntu-latest
    steps:
      - name: Download and summarize both completed Arena artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir a1 a2
          gh api /repos/${{ github.repository }}/actions/artifacts/11348395118/zip > a1.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/11348270609/zip > a2.zip
          unzip -q a1.zip -d a1
          unzip -q a2.zip -d a2
          python - <<'PY'
          import json
          for label,path in [('RUN1','a1/cognitive-arena-result.json'),('RUN2','a2/cognitive-arena-result.json')]:
            d=json.load(open(path))
            print('===',label,'===')
            print('USAGE',d['usage_start'],d['usage_end'])
            for a in d['authors']:
              print('AUTHOR',a['family'],a['author_status'],len(a.get('questions') or []),a.get('cost'))
            for fam,v in d['solves'].items():
              print('SOLVE',fam,v['status'],json.dumps(v.get('parsed'),separators=(',',':'))[:3000])
            for fam,v in d['research'].items():
              print('RESEARCH',fam,v['status'],json.dumps(v.get('parsed'),separators=(',',':'))[:3500])
            for fam,v in d['judges'].items():
              print('JUDGE',fam,v['status'],json.dumps(v.get('parsed'),separators=(',',':'))[:5000])
          PY
