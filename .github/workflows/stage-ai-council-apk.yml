name: Stage AI Council APK
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[STAGE_AI_COUNCIL]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts/11385485598/zip > /tmp/build.zip
          mkdir -p downloads
          unzip -p /tmp/build.zip app-debug.apk > downloads/AI-Council-v0.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-download
          git add downloads/AI-Council-v0.2.apk
          git commit -m "Stage AI Council v0.2 APK for direct download"
          git push --force origin apk-download
