name: One-use full branch consolidation 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-full-branch-consolidation-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  consolidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate mechanically safe refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          repo=os.environ['REPO']; owner=os.environ['OWNER']; token=os.environ['GH_TOKEN']; self_branch=os.environ['SELF_BRANCH']
          api=f'https://api.github.com/repos/{repo}'
          H={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
          def delete_ref(branch):
              ref=urllib.parse.quote(f'heads/{branch}',safe='')
              req=urllib.request.Request(f'{api}/git/refs/{ref}',method='DELETE',headers=H)
              with urllib.request.urlopen(req,timeout=30) as r: return r.status
          def all_pages(path):
              out=[]
              for page in range(1,20):
                  sep='&' if '?' in path else '?'
                  rows=get(f'{api}/{path}{sep}per_page=100&page={page}')
                  out.extend(rows)
                  if len(rows)<100: break
              return out
          branches=all_pages('branches'); prs=all_pages('pulls?state=all')
          main=next(x for x in branches if x['name']=='main'); main_sha=main['commit']['sha']
          open_heads={(p.get('head') or {}).get('ref') for p in prs if p.get('state')=='open'}
          sha_groups={}
          for b in branches:
              if b['name']!='main': sha_groups.setdefault(b['commit']['sha'],[]).append(b['name'])
          explicit=('SUPERSEDED','ONE-USE','TEMPORARY','AUDIT-ONLY','AUDIT ONLY','DO NOT USE','BRANCH SHOULD BE DELETED','CLEANUP COMPLETED','RETIRE STALE','RETIRED')
          def score(n):
              bad=('tmp','stage','staging','work','copy','final2','unused','hygiene/','maintenance/','trigger-','carrier')
              return (sum(x in n.lower() for x in bad),len(n),n)
          dup_keep={sha:sorted(names,key=score)[0] for sha,names in sha_groups.items()}
          deleted=[]; retained=[]
          for b in branches:
              name=b['name']; sha=b['commit']['sha']
              if name in ('main',self_branch): continue
              if name in open_heads:
                  retained.append({'branch':name,'sha':sha,'reason':'OPEN_PR'}); continue
              reason=None
              if sha==main_sha: reason='EXACT_MAIN_HEAD'
              if reason is None:
                  try:
                      cmp=get(f"{api}/compare/{urllib.parse.quote(sha,safe='')}...{urllib.parse.quote(main_sha,safe='')}")
                      if (cmp.get('merge_base_commit') or {}).get('sha')==sha: reason='ANCESTOR_OF_MAIN'
                  except Exception: pass
              exact=[p for p in prs if (p.get('head') or {}).get('ref')==name and (p.get('head') or {}).get('sha')==sha]
              if reason is None and any(p.get('merged_at') for p in exact): reason='EXACT_HEAD_MERGED_PR'
              if reason is None:
                  for p in exact:
                      text=((p.get('title') or '')+'\n'+(p.get('body') or '')).upper()
                      if p.get('state')=='closed' and not p.get('merged_at') and any(m in text for m in explicit): reason='EXACT_HEAD_EXPLICITLY_RETIRED_PR'; break
              if reason is None and len(sha_groups.get(sha,[]))>1 and dup_keep[sha]!=name: reason=f'DUPLICATE_HEAD_OF:{dup_keep[sha]}'
              if not reason:
                  retained.append({'branch':name,'sha':sha,'reason':'UNIQUE_UNRESOLVED'}); continue
              try:
                  live=get(f"{api}/branches/{urllib.parse.quote(name,safe='')}")['commit']['sha']
                  q=urllib.parse.urlencode({'state':'open','head':f'{owner}:{name}','per_page':100})
                  if live!=sha or get(f'{api}/pulls?{q}'):
                      retained.append({'branch':name,'sha':live,'reason':'MOVED_OR_ACTIVE_FAIL_CLOSED'}); continue
                  delete_ref(name); deleted.append({'branch':name,'sha':sha,'reason':reason})
              except urllib.error.HTTPError as exc:
                  if exc.code==404: deleted.append({'branch':name,'sha':sha,'reason':'ALREADY_ABSENT_CONCURRENT'})
                  else: retained.append({'branch':name,'sha':sha,'reason':f'DELETE_HTTP_{exc.code}'})
              except Exception as exc: retained.append({'branch':name,'sha':sha,'reason':'CHECK_FAILED','detail':repr(exc)})
          receipt={'schema':'GardenFullBranchConsolidationReceipt/v1','repository':repo,'main_sha':main_sha,'deleted':deleted,'retained':retained,'policy':'exact-head fail-closed; preserve active or unique unresolved work'}
          with open('full-branch-consolidation-receipt.json','w') as f: json.dump(receipt,f,indent=2,sort_keys=True)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          try: delete_ref(self_branch)
          except Exception as exc: print('self_delete_warning',repr(exc))
          PY
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-branch-consolidation-receipt-${{ github.run_id }}
          path: full-branch-consolidation-receipt.json
          retention-days: 30
          if-no-files-found: warn
