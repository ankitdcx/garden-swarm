name: Model capability epoch 1
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  epoch:
    if: startsWith(github.event.issue.title, '[MODEL_CAPABILITY_EPOCH1]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Run frozen v1 common test and reciprocal author stage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.model_capability_epoch1
      - uses: actions/upload-artifact@v6
        with:
          name: capability-epoch1-stage1
          path: capability-epoch1-stage1.json
          retention-days: 90
