name: One-use stale branch cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-stale-branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only mechanically safe stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request

          repo = os.environ['REPO']
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']
          self_branch = os.environ['SELF_BRANCH']
          api = f'https://api.github.com/repos/{repo}'

          candidates = [
              'fix/deepseek-repo-hardening-20260914',
              'fix/deepseek-repo-hardening-v2-20260914',
              'fix/deepseek-root-version-validation-20260914',
              'fix/deepseek-version-validation-pr',
              'fix/deepseek-version-validation-v2',
              'noop-ignore',
              'policy/garden-conditional-use-license-20260914',
              'policy/garden-outside-use-remedy-20260914',
              'policy/garden-outside-use-remedy-20260914-v2',
          ]
          explicit_superseded = {
              'fix/deepseek-repo-hardening-20260914': '33859db8b54649ec9c9d9b5335ed4e3731222643',
          }

          def request_json(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def delete_ref(branch):
              encoded = urllib.parse.quote(f'heads/{branch}', safe='')
              req = urllib.request.Request(
                  f'{api}/git/refs/{encoded}', method='DELETE', headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status not in (200, 204):
                      raise RuntimeError(f'delete {branch}: HTTP {r.status}')

          def open_prs(branch):
              q = urllib.parse.urlencode({'state':'open','head':f'{owner}:{branch}','per_page':100})
              return request_json(f'{api}/pulls?{q}')

          subprocess.run(['git','fetch','origin','main:refs/remotes/origin/main'], check=True)
          deleted, skipped = [], []
          for branch in candidates:
              if open_prs(branch):
                  skipped.append([branch, 'OPEN_PR'])
                  continue
              try:
                  subprocess.run([
                      'git','fetch','origin',
                      f'refs/heads/{branch}:refs/remotes/origin/{branch}'
                  ], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              except subprocess.CalledProcessError:
                  skipped.append([branch, 'MISSING'])
                  continue
              head = subprocess.check_output([
                  'git','rev-parse',f'refs/remotes/origin/{branch}'
              ], text=True).strip()
              contained = subprocess.run([
                  'git','merge-base','--is-ancestor',head,'refs/remotes/origin/main'
              ]).returncode == 0
              superseded = explicit_superseded.get(branch) == head
              if not (contained or superseded):
                  skipped.append([branch, f'UNIQUE_HEAD:{head}'])
                  continue
              delete_ref(branch)
              deleted.append([branch, 'CONTAINED' if contained else 'EXPLICIT_SUPERSEDED', head])

          print(json.dumps({'deleted': deleted, 'skipped': skipped}, indent=2))

          # Retire this temporary branch after the cleanup receipt has been printed.
          if self_branch.startswith('ops/one-use-stale-branch-cleanup-'):
              try:
                  delete_ref(self_branch)
                  print('self_branch_deleted=', self_branch)
              except Exception as exc:
                  print('self_branch_delete_warning=', repr(exc))
          PY
