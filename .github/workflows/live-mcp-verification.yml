name: Garden live MCP verification

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'SOURCE_MANIFEST.json'
      - 'VERSION'
      - 'TASKS.md'
      - 'EVALUATE_IN_60_MINUTES.md'
      - 'EVALUATION_LOG.md'
      - 'GARDEN_FOR_AGI.md'
      - '.github/workflows/live-mcp-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GARDEN_BASE_URL: ${{ vars.GARDEN_BASE_URL || 'https://garden-swarm.onrender.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install MCP client dependencies
        run: python -m pip install 'mcp>=2,<3' 'httpx>=0.28,<1'
      - name: Verify public HTTPS and MCP
        run: |
          python - <<'PY'
          import asyncio, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from mcp import Client

          base = os.environ['GARDEN_BASE_URL'].rstrip('/')

          def get_json(path):
              url = base + path
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      if r.status != 200:
                          raise RuntimeError(f'HTTP_VERIFICATION_FAILED:{path}:status={r.status}')
                      return json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      f'HTTP_VERIFICATION_FAILED:{path}:status={exc.code}'
                  ) from exc
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise RuntimeError(
                      f'SERVICE_UNREACHABLE:{url}:{type(exc).__name__}:{exc}'
                  ) from exc

          health = get_json('/healthz')
          assert health['status'] == 'ok'
          summary = get_json('/v1/summary')
          assert summary['project'] == 'Garden'
          assert summary['release'] == 'v15.5'
          assert summary['status']['machine_certification'] == 'PENDING'

          async def verify_mcp():
              async with Client(base + '/mcp/') as client:
                  tools = await client.list_tools()
                  names = sorted(tool.name for tool in tools.tools)
                  expected = {
                      'current_release',
                      'list_attack_surfaces',
                      'evaluation_instructions',
                      'public_tasks',
                      'build_finding_payload',
                  }
                  assert expected.issubset(set(names)), names
                  result = await client.call_tool('current_release', {})
                  assert result.is_error is False
                  assert result.structured_content['project'] == 'Garden'
                  assert result.structured_content['status']['machine_certification'] == 'PENDING'
                  return {
                      'protocol_version': str(client.protocol_version),
                      'server_name': getattr(client.server_info, 'name', None),
                      'server_version': getattr(client.server_info, 'version', None),
                      'tools': names,
                      'current_release': result.structured_content,
                  }

          try:
              mcp_result = asyncio.run(asyncio.wait_for(verify_mcp(), timeout=60))
          except TimeoutError as exc:
              raise RuntimeError('MCP_VERIFICATION_TIMEOUT:60s') from exc

          receipt = {
              'schema': 'GardenLiveMCPVerificationReceipt/v0.2',
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'verifier_environment': 'github-actions-ubuntu-latest',
              'base_url': base,
              'health': health,
              'summary_release': summary['release'],
              'mcp': mcp_result,
              'source_commit_under_test': os.environ.get('GITHUB_SHA'),
              'claim_boundary': 'Live reachability and protocol/tool-call verification only; not security, semantic, deployment-safety, or Garden certification.'
          }
          with open('live-mcp-verification-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          PY
      - name: Upload verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: garden-live-mcp-verification-receipt
          path: live-mcp-verification-receipt.json
