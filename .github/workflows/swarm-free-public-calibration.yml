name: Garden free public calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  four-role-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce paused and single-dispatch boundary
        run: python -m tools.check_dispatch_admission

      - name: Run swarm unit tests
        run: python -m unittest discover -s swarm/tests -v

      - name: Run four free agents on public Garden source only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python swarm/orchestrator.py \
            --roles swarm/roles-free.json \
            --role-tier all \
            --public-free \
            --live \
            --max-calls 4 \
            --max-concurrency 1 \
            --max-chars 12000 \
            --max-tokens 4000 \
            --reasoning-effort none \
            --output swarm/runs/free-public-calibration.json

      - name: Validate zero-cost calibration
        run: |
          python - <<'PY'
          import json
          p = json.load(open('swarm/runs/free-public-calibration.json', encoding='utf-8'))
          results = p.get('results', [])
          print('results=', len(results))
          usable = 0
          for r in results:
              output = (r.get('output') or '').strip()
              usage = r.get('usage') or {}
              print(r.get('role_id'), 'status=', r.get('status'),
                    'model=', r.get('returned_model') or r.get('requested_model'),
                    'output_chars=', len(output), 'cost=', usage.get('cost'))
              if r.get('status') == 'OK' and output:
                  usable += 1
              if r.get('status') == 'OK' and usage.get('cost') not in (0, 0.0, None):
                  raise SystemExit('A supposedly free successful call reported non-zero cost')
          print('usable_agents=', usable)
          if usable < 2:
              raise SystemExit(
                  'Need at least two usable independent free-agent outputs; '
                  'do not treat a provider/quota shortfall as review closure'
              )
          PY

      - name: Build candidate synthesis without admitting findings
        run: |
          python swarm/synthesize.py \
            swarm/runs/free-public-calibration.json \
            --output swarm/runs/free-public-synthesis.json

      - name: Verify synthesis remains candidate-only
        run: |
          python - <<'PY'
          import json
          p = json.load(open('swarm/runs/free-public-synthesis.json', encoding='utf-8'))
          assert p['admission_status'] == 'CANDIDATES_ONLY_NOT_ADMITTED'
          assert all(x['status'] == 'NEEDS_CROSS_REFERENCE' for x in p.get('candidates', []))
          print('candidate_count=', p.get('candidate_count'))
          PY

      - name: Upload calibration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-free-public-calibration
          path: |
            swarm/runs/free-public-calibration.json
            swarm/runs/free-public-synthesis.json
          if-no-files-found: warn
