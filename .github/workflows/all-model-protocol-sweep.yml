name: All-model capability protocol sweep
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  sweep:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[ALL_MODEL_PROTOCOL_SWEEP]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Run explicitly authorized all-model protocol sweep
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m tools.all_model_protocol_sweep
      - uses: actions/upload-artifact@v6
        with:
          name: all-model-protocol-sweep
          path: all-model-protocol-sweep.json
          retention-days: 90
