name: One-use failed-cleanup branch retirement 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-failed-cleanup-branch-retirement-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retire failed audit-only cleanup ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          repo=os.environ['REPO']; owner=os.environ['OWNER']; token=os.environ['GH_TOKEN']; self_branch=os.environ['SELF_BRANCH']; api=f'https://api.github.com/repos/{repo}'
          target='maintenance/one-use-superseded-timezone-cleanup-20260915'; expected='1e950acb9e916d94bea6197d005e7f9ef7e14b23'
          def get(url):
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          def delete(branch):
            enc=urllib.parse.quote(f'heads/{branch}',safe='')
            req=urllib.request.Request(f'{api}/git/refs/{enc}',method='DELETE',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=30) as r:
              if r.status not in (200,204):raise RuntimeError(r.status)
          receipt={'schema':'GardenOneUseBranchCleanupReceipt/v1','repository':repo,'deleted':[],'retained':[]}
          try:
            b=get(f"{api}/branches/{urllib.parse.quote(target,safe='')}")
            head=b['commit']['sha']
            q=urllib.parse.urlencode({'state':'open','head':f'{owner}:{target}','per_page':100})
            pr144=get(f'{api}/pulls/144')
            safe=(head==expected and not get(f'{api}/pulls?{q}') and pr144.get('state')=='closed' and not pr144.get('merged_at') and (pr144.get('head') or {}).get('sha')==head and 'Temporary governed cleanup only' in (pr144.get('body') or ''))
            if safe:
              delete(target);receipt['deleted'].append({'branch':target,'head_sha':head,'reason':'CLOSED_FAILED_AUDIT_ONLY_CLEANUP_REF'})
            else:receipt['retained'].append({'branch':target,'head_sha':head,'reason':'SAFETY_PRECONDITION_FAILED'})
          except urllib.error.HTTPError as e:
            if e.code==404:receipt['retained'].append({'branch':target,'reason':'ALREADY_ABSENT'})
            else:raise
          with open('one-use-failed-cleanup-branch-retirement-receipt.json','w') as f:json.dump(receipt,f,indent=2,sort_keys=True)
          print(json.dumps(receipt,indent=2,sort_keys=True))
          try:delete(self_branch);print('self_branch_deleted=',self_branch)
          except Exception as e:print('self_branch_delete_warning=',repr(e))
          PY
      - name: Upload cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-use-failed-cleanup-branch-retirement-receipt-${{ github.run_id }}
          path: one-use-failed-cleanup-branch-retirement-receipt.json
          if-no-files-found: warn
          retention-days: 30
