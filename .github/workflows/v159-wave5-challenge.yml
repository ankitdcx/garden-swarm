name: Garden v15.9 wave 032-036 challenge

on:
  push:
    branches:
      - 'chatgpt/v159-wave5-032-036-20260917'
    paths:
      - 'review-inputs/v159-wave5/challenge-trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    if: github.repository == 'ankitdcx/garden-swarm'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: P032_ARTIFACT_SCHEMA_OWNER_CLOSURE
            source: P032_ARTIFACT_SCHEMA_OWNER_CLOSURE.txt
            candidate: P032_CANDIDATE.txt
          - id: P033_LEGACY50_RECONCILIATION
            source: P033_LEGACY50_RECONCILIATION.txt
            candidate: P033_CANDIDATE.txt
          - id: P034_JUSTICE_REFERENCE_CURRENT_READING
            source: P034_JUSTICE_REFERENCE_CURRENT_READING.txt
            candidate: P034_CANDIDATE.txt
          - id: P035_RCI_RECURSIVE_CONTROL_INTELLIGENCE
            source: P035_RCI_RECURSIVE_CONTROL_INTELLIGENCE.txt
            candidate: P035_CANDIDATE.txt
          - id: P036_RELEASE_ADMISSION_REGISTRY_TEST_STATUS
            source: P036_RELEASE_ADMISSION_REGISTRY_TEST_STATUS.txt
            candidate: P036_CANDIDATE.txt
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial challenge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/v159_wave2_challenge.py "review-inputs/v159-wave5/${{ matrix.source }}" "review-inputs/v159-wave5/challenge/${{ matrix.candidate }}"
      - name: Upload challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-wave5-challenge-${{ matrix.id }}-${{ github.run_id }}
          path: review-results/v159-wave2-challenge/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
