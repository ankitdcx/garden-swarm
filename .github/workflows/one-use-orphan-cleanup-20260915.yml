name: One-use orphan hygiene branch cleanup 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-orphan-cleanup-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact orphan and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          repo = os.environ['REPO']
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']
          self_branch = os.environ['SELF_BRANCH']
          api = f'https://api.github.com/repos/{repo}'
          target = 'maintenance/one-use-dependabot-cleanup-20260915'
          expected_sha = 'b98be8cd2290438531b8e4ddb3b5e0045b76895b'

          def request_json(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          def delete_ref(branch):
              encoded = urllib.parse.quote(f'heads/{branch}', safe='')
              req = urllib.request.Request(
                  f'{api}/git/refs/{encoded}', method='DELETE', headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status not in (200, 204):
                      raise RuntimeError(f'delete {branch}: HTTP {r.status}')

          deleted, retained = [], []
          b = request_json(f"{api}/branches/{urllib.parse.quote(target, safe='')}")
          if b is None:
              retained.append({'branch': target, 'reason': 'ALREADY_ABSENT'})
          else:
              head_sha = b['commit']['sha']
              q = urllib.parse.urlencode({'state':'open','head':f'{owner}:{target}','per_page':100})
              open_prs = request_json(f'{api}/pulls?{q}') or []
              if open_prs:
                  retained.append({'branch': target, 'reason': 'OPEN_PR', 'head_sha': head_sha, 'open_prs': [p['number'] for p in open_prs]})
              elif head_sha != expected_sha:
                  retained.append({'branch': target, 'reason': 'HEAD_MOVED', 'head_sha': head_sha, 'expected_sha': expected_sha})
              else:
                  delete_ref(target)
                  deleted.append({'branch': target, 'head_sha': head_sha, 'reason': 'RUN_OWNED_EMPTY_BRANCH_EXACT_SHA'})

          receipt = {
              'schema': 'GardenOneUseBranchCleanupReceipt/v1',
              'repository': repo,
              'deleted': deleted,
              'retained': retained,
              'dependabot_enabled_unchanged': True,
          }
          with open('one-use-orphan-cleanup-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
          print(json.dumps(receipt, indent=2, sort_keys=True))

          try:
              delete_ref(self_branch)
              print('self_branch_deleted=', self_branch)
          except Exception as exc:
              print('self_branch_delete_warning=', repr(exc))
          PY
      - name: Upload cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-use-orphan-cleanup-receipt-${{ github.run_id }}
          path: one-use-orphan-cleanup-receipt.json
          if-no-files-found: warn
          retention-days: 30
