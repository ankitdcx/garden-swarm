name: Garden branch lifecycle

on:
  workflow_dispatch:
  # Hygiene is a due obligation of the single Garden Coordinator.

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest tests.test_branch_lifecycle
      - name: Generate typed receipt
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python tools/check_branch_lifecycle.py \
            --repo "${{ github.repository }}" \
            --observed-at "${{ github.run_started_at }}" \
            --output branch-lifecycle-receipt.json
          rc=$?
          echo "scanner_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload BranchLifecycleReceipt
        uses: actions/upload-artifact@v4
        with:
          name: branch-lifecycle-receipt-${{ github.run_id }}
          path: branch-lifecycle-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce lifecycle result
        if: steps.scan.outputs.scanner_rc != '0'
        run: |
          cat branch-lifecycle-receipt.json
          echo 'CHECK-BRANCH-LIFECYCLE-001 requires review or cleanup.' >&2
          exit 1
