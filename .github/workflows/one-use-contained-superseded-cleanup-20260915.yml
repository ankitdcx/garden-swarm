name: One-use contained and superseded branch cleanup 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-contained-superseded-cleanup-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete only mechanically proven contained or explicitly superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo = os.environ['REPO']
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']
          self_branch = os.environ['SELF_BRANCH']
          api = f'https://api.github.com/repos/{repo}'
          contained_candidates = [
              'ip/patent-provenance-audit-20260914',
              'repair/branch-lifecycle-check-20260914',
          ]
          superseded_candidates = {
              'ip/patent-provenance-audit-v2-20260914': {
                  'expected_sha': '85c17dce72ebc4428d6a139e17e1fdf6bb5a0ef7',
                  'pr': 103,
                  'marker': 'SUPERSEDED BEFORE MERGE',
              },
              'ops/ip-deepseek-simple-reviewer-20260914': {
                  'expected_sha': 'e0706db8bfed045c849ccc8c8274e7f3654d19c1',
                  'pr': 107,
                  'marker': 'SUPERSEDED BEFORE MERGE',
              },
          }

          def request_json(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def branch_head(branch):
              b = request_json(f"{api}/branches/{urllib.parse.quote(branch, safe='')}")
              return b['commit']['sha']

          def open_prs(branch):
              q = urllib.parse.urlencode({'state':'open','head':f'{owner}:{branch}','per_page':100})
              return request_json(f'{api}/pulls?{q}')

          def delete_ref(branch):
              encoded = urllib.parse.quote(f'heads/{branch}', safe='')
              req = urllib.request.Request(
                  f'{api}/git/refs/{encoded}', method='DELETE', headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status not in (200, 204):
                      raise RuntimeError(f'delete {branch}: HTTP {r.status}')

          deleted, retained = [], []
          for branch in contained_candidates:
              try:
                  head_sha = branch_head(branch)
                  if open_prs(branch):
                      retained.append({'branch': branch, 'reason': 'OPEN_PR', 'head_sha': head_sha})
                      continue
                  comp = request_json(f"{api}/compare/{head_sha}...main")
                  contained = comp.get('merge_base_commit', {}).get('sha') == head_sha and int(comp.get('behind_by', -1)) == 0
                  if not contained:
                      retained.append({'branch': branch, 'reason': 'NOT_PROVEN_CONTAINED', 'head_sha': head_sha, 'status': comp.get('status')})
                      continue
                  delete_ref(branch)
                  deleted.append({'branch': branch, 'head_sha': head_sha, 'reason': 'PROVEN_ANCESTOR_OF_MAIN'})
              except Exception as exc:
                  retained.append({'branch': branch, 'reason': 'CHECK_FAILED', 'detail': repr(exc)})

          for branch, rule in superseded_candidates.items():
              try:
                  head_sha = branch_head(branch)
                  if open_prs(branch):
                      retained.append({'branch': branch, 'reason': 'OPEN_PR', 'head_sha': head_sha})
                      continue
                  pr = request_json(f"{api}/pulls/{rule['pr']}")
                  valid = (
                      head_sha == rule['expected_sha']
                      and pr.get('state') == 'closed'
                      and not pr.get('merged_at')
                      and (pr.get('head') or {}).get('sha') == head_sha
                      and rule['marker'] in (pr.get('body') or '')
                  )
                  if not valid:
                      retained.append({'branch': branch, 'reason': 'SUPERSEDED_EVIDENCE_MISMATCH', 'head_sha': head_sha, 'pr': rule['pr']})
                      continue
                  delete_ref(branch)
                  deleted.append({'branch': branch, 'head_sha': head_sha, 'reason': 'EXPLICIT_SUPERSEDED_CLOSED_UNMERGED_PR', 'pr': rule['pr']})
              except Exception as exc:
                  retained.append({'branch': branch, 'reason': 'CHECK_FAILED', 'detail': repr(exc)})

          receipt = {
              'schema': 'GardenOneUseBranchCleanupReceipt/v1',
              'repository': repo,
              'policy': 'delete only proven ancestor-of-main branches or exact-head closed-unmerged PRs carrying an explicit SUPERSEDED BEFORE MERGE marker',
              'deleted': deleted,
              'retained': retained,
          }
          with open('one-use-contained-superseded-cleanup-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
          print(json.dumps(receipt, indent=2, sort_keys=True))

          if self_branch.startswith('maintenance/one-use-contained-superseded-cleanup-'):
              try:
                  delete_ref(self_branch)
                  print('self_branch_deleted=', self_branch)
              except Exception as exc:
                  print('self_branch_delete_warning=', repr(exc))
          PY
      - name: Upload cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-use-contained-superseded-cleanup-receipt-${{ github.run_id }}
          path: one-use-contained-superseded-cleanup-receipt.json
          if-no-files-found: warn
          retention-days: 30
