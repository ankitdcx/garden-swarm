name: Build signed AI Council release
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  build:
    if: startsWith(github.event.issue.title, '[BUILD_AI_COUNCIL_RELEASE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build release
        run: cd android-ai-council && gradle :app:assembleRelease
      - name: Create local signing key and sign
        run: |
          keytool -genkeypair -v -keystore /tmp/council.jks -storepass council2026 -keypass council2026 -alias council -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AI Council,O=Personal,C=IN"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 android-ai-council/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/AI-Council-v0.3-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/council.jks --ks-key-alias council --ks-pass pass:council2026 --key-pass pass:council2026 --out /tmp/AI-Council-v0.3.apk /tmp/AI-Council-v0.3-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/AI-Council-v0.3.apk
          "$ANDROID_HOME/build-tools/$(basename "$BUILD_TOOLS")/aapt" dump badging /tmp/AI-Council-v0.3.apk | head -20
      - name: Publish on apk-download branch
        run: |
          git fetch origin apk-download
          git checkout apk-download
          mkdir -p downloads
          cp /tmp/AI-Council-v0.3.apk downloads/AI-Council-v0.3.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AI-Council-v0.3.apk
          git commit -m "Publish signed AI Council v0.3 APK"
          git push origin apk-download
