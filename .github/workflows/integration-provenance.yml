name: Multi-agent integration provenance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'swarm/**'
      - 'prototype/**'
      - 'server/**'
      - 'tools/**'
      - 'scripts/**'
      - 'gsl/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/task-claim.yml'
      - 'Makefile'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: read

jobs:
  integration-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run integration provenance unit tests
        run: |
          python -m unittest discover -s swarm/tests -v
          python -m unittest discover -s tests -p 'test_multi_agent_pr_check.py' -v
          python -m unittest tests.test_single_scheduler tests.test_paid_cost_validation tests.test_paid_review_routing -v

      - name: Check declared work intent against concurrent PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.check_multi_agent_pr
