name: Garden Relay Android

on:
  pull_request:
    paths:
      - "android/garden-relay/**"
      - "relay/mobile/**"
      - ".github/workflows/garden-relay-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/garden-relay :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: garden-relay-debug-apk
          path: android/garden-relay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
