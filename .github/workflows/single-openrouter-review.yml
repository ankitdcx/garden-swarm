name: Garden single OpenRouter review

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'ankitdcx/garden-swarm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GARDEN_OPENROUTER_PROTOCOL: INDEPENDENT_BRANCH_CONVERGENCE_V1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent-branch protocol offline
        run: |
          python -m unittest tests.test_independent_branch_protocol -v
          python -m unittest tests.test_single_review_worker tests.test_review_continuation -v
      - name: Admit only the registered isolated single-call host and persistent state
        env:
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.independent_branch_preflight
      - name: Execute at most one isolated OpenRouter review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.independent_branch_worker
      - name: Continue only same-packet isolated reviewers
        if: success()
        env:
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.independent_branch_continuation
      - name: Save review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-independent-branch-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: agents/outbox/single-review/receipt.json
          if-no-files-found: warn
          retention-days: 90
