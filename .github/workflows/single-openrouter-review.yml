name: Garden single OpenRouter review

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-provider-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'ankitdcx/garden-swarm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the single-call boundary offline
        run: python -m unittest tests.test_single_review_worker -v
      - name: Admit only the registered single-call host and persistent state
        env:
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.check_dispatch_admission --single-public-review
      - name: Execute one pending public review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python -m tools.single_review_worker
      - name: Save review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-single-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: agents/outbox/single-review/receipt.json
          if-no-files-found: warn
          retention-days: 90
