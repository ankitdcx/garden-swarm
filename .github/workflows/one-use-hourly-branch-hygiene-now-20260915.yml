name: One-use hourly branch hygiene now 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-hourly-branch-hygiene-now-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete exact-head stale refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          repo = os.environ['REPO']
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']
          self_branch = os.environ['SELF_BRANCH']
          api = f'https://api.github.com/repos/{repo}'

          candidates = {
              'fix/hourly-ist-sequence-20260915': {'mode':'SUPERSEDED','pr':129,'sha':'5f08301e88d75dd8acf0c207a847fe86be33d2d2'},
              'fix/hourly-ist-sequence-current-main-20260915': {'mode':'MERGED','pr':130,'sha':'c397a15eb60a59f57415030e85f71e87a8084c8c'},
              'fix/ip-origin-review-selection-compat-20260915-v2': {'mode':'SUPERSEDED','pr':132,'sha':'79d3e46c68774736ce7865ea728ea11ad1019acc'},
              'fix/ip-origin-review-selection-compat-20260915-v3': {'mode':'MERGED','pr':133,'sha':'07b7fa29fa0466a8054645cb158396cda256674c'},
              'fix/ip-origin-review-selection-compat-20260915': {'mode':'ANCESTOR','sha':'c7d742c8f9bda83cbd9cc3061ebdeefd65568a4e'},
              'ip/expand-origin-review-all-families-20260915': {'mode':'MERGED','pr':135,'sha':'612137a575d6d3dcd8ade1e4dc5b16500c9d2abc'},
              'ip/fix-multi-family-origin-review-20260915': {'mode':'SUPERSEDED','pr':134,'sha':'ec4bbe06a7f9875d673c9bf2467575e6238ebee6'},
              'ip/install-origin-multi-agent-review-20260915': {'mode':'ANCESTOR','sha':'4da3dacc736711ec6454f224446ea98bb5aa6f4f'},
              'ip/install-origin-multi-agent-review-v2-20260915': {'mode':'MERGED','pr':128,'sha':'02d7f8a1ff66fbd4c57c4b40c2f7b168f44c30b9'},
              'ip/origin-inventory-seed-20260915': {'mode':'ANCESTOR','sha':'c7d742c8f9bda83cbd9cc3061ebdeefd65568a4e'},
              'ip/origin-inventory-seed-v2-20260915': {'mode':'SUPERSEDED','pr':131,'sha':'6d2790005666f82a0eed3dce8f2891b6905d68bc'},
              'ip/public-patent-provenance-current-20260915': {'mode':'SUPERSEDED','pr':120,'sha':'0ad619050d433084bd7f0ee5b90299f35b2c2202'},
              'pr/openrouter-multitrack-specialist-system-current-main-20260915': {'mode':'MERGED','pr':127,'sha':'77d1ca1a09caf6ecbe5bbbf46700145630df347b'},
              'pr/openrouter-many-agent-1usd-day-20260915': {'mode':'SUCCESSOR','pr':118,'successor_pr':127,'sha':'1acff3745946a44d742c9876231cb7f56ad5ba84'},
              'pr/openrouter-multitrack-specialist-system-20260915': {'mode':'SUCCESSOR','pr':126,'successor_pr':127,'sha':'d5be64be56c6db6d28833225fa59f727a54f4f2e'},
              'pr/openrouter-multitrack-specialist-system-20260915-copy': {'mode':'SAME_HEAD_SUCCESSOR','source_pr':126,'successor_pr':127,'sha':'d5be64be56c6db6d28833225fa59f727a54f4f2e'},
              'pr/openrouter-multitrack-specialist-system-20260915-final': {'mode':'SAME_HEAD_SUCCESSOR','source_pr':126,'successor_pr':127,'sha':'d5be64be56c6db6d28833225fa59f727a54f4f2e'},
          }

          def request_json(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def delete_ref(branch):
              encoded = urllib.parse.quote(f'heads/{branch}', safe='')
              req = urllib.request.Request(
                  f'{api}/git/refs/{encoded}', method='DELETE',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f'delete {branch}: HTTP {response.status}')

          def open_prs(branch):
              q = urllib.parse.urlencode({'state':'open','head':f'{owner}:{branch}','per_page':100})
              return request_json(f'{api}/pulls?{q}')

          def successor_explicitly_supersedes(successor, old_pr):
              text = ((successor.get('title') or '') + '\n' + (successor.get('body') or '')).lower()
              return bool(successor.get('merged_at')) and ('supersed' in text) and (f'#{old_pr}' in text)

          deleted, retained = [], []
          for branch, rule in candidates.items():
              try:
                  try:
                      branch_data = request_json(f"{api}/branches/{urllib.parse.quote(branch, safe='')}")
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          retained.append({'branch':branch,'reason':'ALREADY_ABSENT'})
                          continue
                      raise
                  head_sha = branch_data['commit']['sha']
                  if head_sha != rule['sha']:
                      retained.append({'branch':branch,'reason':'HEAD_MOVED','expected':rule['sha'],'actual':head_sha})
                      continue
                  if open_prs(branch):
                      retained.append({'branch':branch,'reason':'OPEN_PR','head_sha':head_sha})
                      continue

                  mode = rule['mode']
                  valid = False
                  reason = None
                  if mode in ('MERGED','SUPERSEDED'):
                      pr = request_json(f"{api}/pulls/{rule['pr']}")
                      exact = (pr.get('head') or {}).get('sha') == head_sha
                      if mode == 'MERGED':
                          valid = exact and bool(pr.get('merged_at'))
                          reason = 'EXACT_HEAD_MERGED_PR'
                      else:
                          text = ((pr.get('title') or '') + '\n' + (pr.get('body') or '')).upper()
                          valid = exact and pr.get('state') == 'closed' and not pr.get('merged_at') and 'SUPERSEDED' in text
                          reason = 'EXACT_HEAD_EXPLICITLY_SUPERSEDED_PR'
                  elif mode == 'ANCESTOR':
                      cmp = request_json(f"{api}/compare/{head_sha}...main")
                      valid = (cmp.get('merge_base_commit') or {}).get('sha') == head_sha and int(cmp.get('behind_by', 0)) == 0
                      reason = 'EXACT_HEAD_ANCESTOR_OF_MAIN'
                  elif mode == 'SUCCESSOR':
                      pr = request_json(f"{api}/pulls/{rule['pr']}")
                      successor = request_json(f"{api}/pulls/{rule['successor_pr']}")
                      exact = (pr.get('head') or {}).get('sha') == head_sha
                      valid = exact and pr.get('state') == 'closed' and not pr.get('merged_at') and successor_explicitly_supersedes(successor, rule['pr'])
                      reason = 'EXACT_HEAD_EXPLICITLY_SUPERSEDED_BY_MERGED_SUCCESSOR'
                  elif mode == 'SAME_HEAD_SUCCESSOR':
                      source = request_json(f"{api}/pulls/{rule['source_pr']}")
                      successor = request_json(f"{api}/pulls/{rule['successor_pr']}")
                      valid = (source.get('head') or {}).get('sha') == head_sha and source.get('state') == 'closed' and not source.get('merged_at') and successor_explicitly_supersedes(successor, rule['source_pr'])
                      reason = 'EXACT_SAME_HEAD_AS_PR_SUPERSEDED_BY_MERGED_SUCCESSOR'

                  if not valid:
                      retained.append({'branch':branch,'reason':'EVIDENCE_MISMATCH','mode':mode,'head_sha':head_sha})
                      continue
                  delete_ref(branch)
                  deleted.append({'branch':branch,'head_sha':head_sha,'reason':reason})
              except Exception as exc:
                  retained.append({'branch':branch,'reason':'CHECK_FAILED','detail':repr(exc)})

          receipt = {
              'schema':'GardenOneUseBranchCleanupReceipt/v1',
              'repository':repo,
              'policy':'exact-head + no-open-PR + merged/superseded/ancestor/successor evidence only',
              'deleted':deleted,
              'retained':retained,
          }
          with open('one-use-hourly-branch-hygiene-receipt.json','w',encoding='utf-8') as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
          print(json.dumps(receipt, indent=2, sort_keys=True))

          if self_branch.startswith('maintenance/one-use-hourly-branch-hygiene-now-'):
              try:
                  delete_ref(self_branch)
                  print('self_branch_deleted=', self_branch)
              except Exception as exc:
                  print('self_branch_delete_warning=', repr(exc))
          PY
      - name: Upload cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-use-hourly-branch-hygiene-receipt-${{ github.run_id }}
          path: one-use-hourly-branch-hygiene-receipt.json
          if-no-files-found: error
          retention-days: 30
