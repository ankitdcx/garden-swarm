name: Garden v15.9 R2 final adversarial challenge
on:
  push:
    branches:
      - 'chatgpt/v159-postfreeze-scattered-upgrades-20260918'
    paths:
      - 'review-inputs/v159-postfreeze/final-challenge-trigger.json'
permissions:
  contents: read
concurrency:
  group: v159-r2-final-challenge
  cancel-in-progress: false
jobs:
  challenge:
    if: github.repository == 'ankitdcx/garden-swarm'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        family: [deepseek, glm, gemini]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one isolated R2 adversarial challenge
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/v159_final_challenge.py --family "${{ matrix.family }}"
      - name: Upload challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-r2-challenge-${{ matrix.family }}-${{ github.run_id }}
          path: review-results/v159-postfreeze-final-challenge/${{ matrix.family }}.json
          if-no-files-found: error
          retention-days: 30
