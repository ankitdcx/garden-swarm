name: Garden v15.9 post-freeze final challenge

on:
  push:
    branches:
      - 'chatgpt/v159-postfreeze-scattered-upgrades-20260918'
    paths:
      - 'review-inputs/v159-postfreeze/challenge-trigger.json'

permissions:
  contents: read

concurrency:
  group: v159-postfreeze-final-challenge
  cancel-in-progress: false

jobs:
  challenge:
    if: github.repository == 'ankitdcx/garden-swarm'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        family: [deepseek, qwen, glm, xiaomi]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One combined adversarial challenge call
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tools/v159_postfreeze_challenge.py --family "${{ matrix.family }}"
      - name: Upload isolated challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-postfreeze-challenge-${{ matrix.family }}-${{ github.run_id }}
          path: review-results/v159-postfreeze-challenge/${{ matrix.family }}.json
          if-no-files-found: error
          retention-days: 30
